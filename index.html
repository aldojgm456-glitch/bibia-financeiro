<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF0F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bibia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Bibia 💖 controle de gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Fredoka:wght@400..700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF0F6; --surface:#FFFFFF; --surface-2:#FFF4F9; --ink:#2F2029; --muted:#7E6173; --line:#F8D9E7;
  --brand:#EC73A5; --brand-ink:#5E1B3B; --brand-soft:#FFF0F6;
  --pos:#23A26D; --pos-soft:#E2F5EC; --pos-ink:#14724A;
  --neg:#DC4C43; --neg-soft:#FCE8E6; --neg-ink:#B0302A;
  --warn:#E0952B; --warn-soft:#FDF0DA; --warn-ink:#8F5508;
  --hero:#FFF2F8; --hero2:#FFE1ED; --hero-ink:#6A1F44; --scrim:rgba(43,16,32,.5);
  --shadow:0 1px 2px rgba(229,82,139,.04),0 10px 28px rgba(229,82,139,.07);
  color-scheme:light only;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body.modal-open{overflow:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.grow{flex:1}
.hide{display:none!important}

/* layout */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 22px;font-family:'Fredoka','Nunito',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em}
.script{font-family:'Dancing Script','Fredoka',cursive;font-weight:700;letter-spacing:0;color:var(--brand)}
h1 .script{font-size:36px;line-height:1.2}
.brand .script{font-size:32px;line-height:1}
.welcome ol{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.brand i{width:34px;height:34px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:#B8366F}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:35;display:none}
.scrim.show{display:block}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 24px}
.topbar-in{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:10px}
.menu-btn{display:none}
.mnav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px}
.mnav select{border:0;background:transparent;padding:8px 4px;font-weight:600;border-radius:10px;cursor:pointer;max-width:130px}
.mnav select option{color:#17212B;background:#fff}
.content{max-width:1160px;margin:0 auto;padding:6px 24px 56px}
.newwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:25}
.menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:11px 12px;border-radius:10px;text-align:left;font-weight:600}
.menu button:hover{background:var(--surface-2)}

/* components */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:10px 0 20px}
h1{font-family:'Fredoka','Nunito',sans-serif;font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.sub{color:var(--muted);margin-top:2px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
h2{font-family:'Fredoka','Nunito',sans-serif;font-size:19px;font-weight:600;letter-spacing:-.015em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.pad{padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--brand)}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff}
.btn.danger:hover{background:var(--neg);filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700;border:0;white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos-ink)}
.chip.neg{background:var(--neg-soft);color:var(--neg-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.muted{background:var(--surface-2);color:var(--muted)}
button.chip:hover{filter:brightness(.96)}
.t-pos{color:var(--pos-ink)}.t-neg{color:var(--neg-ink)}.t-warn{color:var(--warn-ink)}.t-muted{color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex:none}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn-ink);border-radius:16px;padding:12px 16px;margin:6px 0 16px;font-weight:500}
.banner>div{display:flex;align-items:center;gap:10px}
.banner.neg{background:var(--neg-soft);color:var(--neg-ink)}
.banner .btn{background:var(--surface);color:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.stat{padding:18px 20px}
.stat-l{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:14px}
.stat-l i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.stat-l i.pos{background:var(--pos-soft);color:var(--pos-ink)}
.stat-l i.neg{background:var(--neg-soft);color:var(--neg-ink)}
.stat-l i.warn{background:var(--warn-soft);color:var(--warn-ink)}
.stat-l i.brand{background:var(--brand-soft);color:var(--brand)}
.stat-v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:8px;line-height:1.15}
.stat-s{font-size:13px;color:var(--muted);margin-top:4px;min-height:20px}
.stat.hero{background:linear-gradient(135deg,var(--hero),var(--hero2));color:var(--hero-ink);border-color:var(--line);grid-column:1/-1}
.stat.hero .stat-l{color:var(--hero-ink)}
.stat.hero .stat-l i{background:color-mix(in srgb,var(--hero-ink) 12%,transparent);color:var(--hero-ink)}
.stat.hero .stat-v{font-family:'Fredoka','Nunito',sans-serif;font-size:42px}
.stat.hero .stat-s{color:var(--hero-ink);opacity:.8}
.stat.hero .stat-v.t-neg{color:var(--neg-ink)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.grid2.wide{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.chart-box{position:relative;height:260px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;margin-right:6px;display:inline-block}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-wrap .chart-box{width:190px;height:190px;flex:none}
.cat-list{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.cat-list div{display:flex;align-items:center;gap:6px}
.cat-list b{margin-left:auto;font-weight:600}
.cat-list em{font-style:normal;color:var(--muted);width:40px;text-align:right}

/* indicator */
.ind{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:18px 20px;margin-bottom:14px}
.ind-t{font-weight:700;font-size:16px}
.ind-s{color:var(--muted);font-size:14px;margin-top:2px}
.ind-main{flex:1;min-width:240px}
.meter{flex:1.2;min-width:220px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--pos)}
.bar.warn>i{background:var(--warn)}.bar.neg>i{background:var(--neg)}
.meter-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.ind-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.ind-ic.pos{background:var(--pos-soft);color:var(--pos-ink)}.ind-ic.warn{background:var(--warn-soft);color:var(--warn-ink)}.ind-ic.neg{background:var(--neg-soft);color:var(--neg-ink)}.ind-ic.muted{background:var(--surface-2);color:var(--muted)}

/* lists */
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.is-late{box-shadow:inset 3px 0 0 var(--neg)}
.row.is-soon{box-shadow:inset 3px 0 0 var(--warn)}
.row .date{width:44px;text-align:center;font-weight:700;font-size:18px;line-height:1.1;flex:none}
.row .date small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;font-size:13px;color:var(--muted)}
.row .meta span{display:inline-flex;align-items:center;gap:4px}
.row .amt{font-weight:700;min-width:104px;text-align:right}
.row .actions{display:flex;gap:2px;flex:none}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.sum{padding:14px 18px}
.sum small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.sum b{font-size:20px;letter-spacing:-.01em}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--muted)}
.pill.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.sec-t{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between}
.empty{text-align:center;padding:44px 20px}
.empty.small{padding:20px}
.empty-ic{width:56px;height:56px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 12px}
.empty h3{font-size:17px;margin-bottom:4px}
.empty p{color:var(--muted);margin-bottom:16px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.cur td{background:var(--brand-soft)}

/* credit cards */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:16px}
.ccard{border-radius:20px;padding:18px;color:#fff;background:var(--cc,#4559D9);text-align:left;border:3px solid transparent;display:flex;flex-direction:column;gap:14px;min-height:178px;position:relative}
.ccard.sel{box-shadow:0 0 0 3px var(--ink)}
.ccard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ccard h3{font-family:'Fredoka','Nunito',sans-serif;font-size:19px;font-weight:600}
.ccard small{opacity:.8;display:block;font-size:12.5px}
.ccard .big{font-size:22px;font-weight:700}
.ccard .bar{background:rgba(255,255,255,.25);height:8px}
.ccard .bar>i{background:#fff}
.ccard .cc-act{display:flex;gap:2px}
.ccard .cc-act .icon-btn{color:#fff;width:32px;height:32px}
.ccard .cc-act .icon-btn:hover{background:rgba(255,255,255,.18);color:#fff}
.ccard-foot{display:flex;justify-content:space-between;font-size:13px;opacity:.92}
.ccard-add{border:2px dashed var(--line);background:transparent;color:var(--muted);border-radius:20px;min-height:178px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600}
.ccard-add:hover{border-color:var(--brand);color:var(--brand)}
.inv-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.inv-chip{flex:none;min-width:104px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.inv-chip b{display:block;font-size:13.5px}
.inv-chip span{display:block;font-size:12.5px;color:var(--muted)}
.inv-chip.on{border-color:var(--brand);background:var(--brand-soft)}
.inv-chip .st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--line)}
.inv-chip .st.paga{background:var(--pos)}.inv-chip .st.fechada{background:var(--warn)}.inv-chip .st.atrasada{background:var(--neg)}
.inv-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.inv-total{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.note{font-size:13px;color:var(--muted)}

/* planning */
.alloc{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:10px 0 12px}
.alloc i{display:block;height:100%}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:700}
.kv.total{font-size:16px}
.kv.total span{color:var(--ink);font-weight:600}
.inline-in{width:70px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

/* forms */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input:not([type=radio]):not([type=checkbox]),.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:44px}
.field textarea{min-height:68px;resize:vertical}
.field input:disabled,.field select:disabled{opacity:.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;min-height:44px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:flex;align-items:center;justify-content:center;height:100%;min-height:38px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer;margin:0;font-size:14px}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--brand)}
.check{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:10px}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.recur{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.recur .count-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.recur input[type=number]{width:72px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.err{color:var(--neg-ink);font-weight:600;font-size:14px;min-height:20px;margin:-4px 0 8px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 14px}
.swatches{display:flex;gap:8px}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;inset:0;margin:0}
.swatches span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.modal-wrap{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:22px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto;animation:pop .16s ease-out;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.modal-body{padding:10px 20px 20px;overflow-y:auto}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.muted-p{color:var(--muted);margin-bottom:16px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .16s ease-out}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:120px}
.set-sec{padding:20px;margin-bottom:14px}
.set-sec h2{margin-bottom:4px}
.set-sec .note{margin-bottom:14px}
.inline-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline-form .field{margin:0;flex:1;min-width:180px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:auto;width:288px;z-index:40;transform:translateX(-102%);transition:transform .2s;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .sidebar.open{transform:none}
  .menu-btn{display:inline-grid}
  .topbar{padding:10px 14px}
  .content{padding:4px 14px 48px}
  .grid2,.grid2.wide{grid-template-columns:minmax(0,1fr)}
  h1{font-size:26px}
}
@media (max-width:640px){
  .row{flex-wrap:wrap;padding:14px}
  .row .main{flex-basis:calc(100% - 60px)}
  .row .amt{order:3;text-align:left;min-width:0}
  .row .actions{margin-left:auto;order:4}
  .newwrap .lbl{display:none}
  .today-btn{display:none}
  .two{grid-template-columns:1fr}
  .mnav select{max-width:104px;padding:8px 2px}
  .donut-wrap{justify-content:center}
}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}

const cloud={state:'checking',timer:null,busy:false,dirty:false,pulling:false};
function cloudSet(st){
  cloud.state=st;
  const t=st==='cloud'?'☁️ Salvo na nuvem':st==='checking'?'Sincronizando…':'⚠️ Sem conexão: salvo no aparelho, envio quando voltar';
  document.querySelectorAll('.syncStat').forEach(el=>{el.textContent=t;});
}
async function cloudPull(){
  if(!sb||!UID||cloud.pulling)return;
  cloud.pulling=true;
  try{
    const r=await sb.from('dados').select('json').eq('user_id',UID).maybeSingle();
    if(r.error)throw r.error;
    const rs=r.data?parseState(r.data.json):null;

    if(rs&&rts>lts&&!modalEl){
      S=rs;
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      U.cardId=null;U.invMi=null;render();
    }
    cloudSet('cloud');
    if(lts>rts){cloud.pulling=false;await cloudWrite();}
  }catch(e){cloudSet('offline');}
  cloud.pulling=false;
}
function cloudPush(){if(!sb||!UID)return;cloud.dirty=true;clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudWrite,700);}
async function cloudWrite(){
  if(!sb||!UID||!S)return;
  if(cloud.busy){cloud.dirty=true;return;}
  cloud.busy=true;cloud.dirty=false;
  try{
    const r=await sb.from('dados').upsert({user_id:UID,json:S,updated_at:new Date().toISOString()},{onConflict:'user_id'});

const cardById=id=>S.cards.find(c=>c.id===id);
function splitCents(total,n){const base=Math.floor(total/n);const rem=total-base*n;return Array.from({length:n},(_,i)=>base+(i===0?rem:0));}
/* mês (índice) da fatura, pelo vencimento, que recebe a compra feita em "date" */
function firstDueMi(card,date){
  const p=parseYMD(date);const mi=p.y*12+p.m;
  const closeDay=Math.min(card.closingDay,dim(p.y,p.m));
  const closeMi=p.d<closeDay?mi:mi+1;
  return card.dueDay>card.closingDay?closeMi:closeMi+1;
}
function invDates(card,dueMi){
  const closeMi=card.dueDay>card.closingDay?dueMi:dueMi-1;
  return{closing:ymdMi(closeMi,card.closingDay),due:ymdMi(dueMi,card.dueDay)};
}
let D={};
function buildItems(){
  const out=[];
  for(const p of S.purchases){
    const card=cardById(p.cardId);if(!card)continue;
    const first=firstDueMi(card,p.date),parts=splitCents(p.total,p.n),pmi=miOfDate(p.date);
    for(let k=0;k<p.n;k++)out.push({pid:p.id,cardId:p.cardId,desc:p.desc,category:p.category,k:k+1,n:p.n,amount:parts[k],dueMi:first+k,compMi:pmi+k,date:p.date});
  }
  return out;
}
function derive(){
  const today=todayStr();
  const items=buildItems();
  const seen={},keys=[];
  for(const it of items){const k=it.cardId+'|'+it.dueMi;if(!seen[k]){seen[k]=1;keys.push({cardId:it.cardId,dueMi:it.dueMi});}}
  D={today,todayMi:miOfDate(today),items,invKeys:keys,memo:{}};
}
function invoice(cardId,dueMi){
  const card=cardById(cardId);
  const its=D.items.filter(i=>i.cardId===cardId&&i.dueMi===dueMi);
  const total=sumBy(its,i=>i.amount);
  const d=invDates(card,dueMi);
  const pay=S.invoicePaid[cardId+'|'+dueMi];
  const paid=!!pay;
  const status=paid?'paga':(D.today>=d.closing?'fechada':'aberta');
  const overdue=!paid&&total>0&&D.today>d.due;
  return{card,dueMi,items:its,total,closing:d.closing,due:d.due,paid,status,overdue,paidDate:paid?pay.date:null};
}
function agg(mi){
  if(D.memo[mi])return D.memo[mi];
  const a={incRec:0,incPen:0,billsPaid:0,billsPen:0,billsFixed:0,billsVar:0,invTotal:0,invPaid:0,cardSpend:0,cat:{}};
  for(const i of S.incomes)if(miOfDate(i.date)===mi){if(i.status==='recebido')a.incRec+=i.amount;else a.incPen+=i.amount;}
  for(const b of S.bills)if(miOfDate(b.due)===mi){
    if(b.status==='paga')a.billsPaid+=b.amount;else a.billsPen+=b.amount;
    if(b.tipo==='fixa')a.billsFixed+=b.amount;else a.billsVar+=b.amount;
    a.cat[b.category]=(a.cat[b.category]||0)+b.amount;
  }
  for(const it of D.items){
    if(it.dueMi===mi){a.invTotal+=it.amount;if(S.invoicePaid[it.cardId+'|'+mi])a.invPaid+=it.amount;}
    if(it.compMi===mi){a.cardSpend+=it.amount;a.cat[it.category]=(a.cat[it.category]||0)+it.amount;}
  }
  a.incTotal=a.incRec+a.incPen;
  a.billsTotal=a.billsPaid+a.billsPen;
  a.invUnpaid=a.invTotal-a.invPaid;
  a.spentReal=a.billsPaid+a.cardSpend;      /* gastos: contas pagas + compras no cartão */
  a.spentPlan=a.billsTotal+a.cardSpend;     /* gastos: contas (pagas e pendentes) + compras no cartão */
  a.committed=a.billsTotal+a.invTotal;      /* saída de caixa: contas + faturas */
  a.net=a.incTotal-a.committed;
  return D.memo[mi]=a;
}
/* dinheiro em conta agora: só o que foi recebido e pago (receita pendente não entra) */
function cash(){
  let c=S.settings.initialBalance||0;
  for(const i of S.incomes)if(i.status==='recebido')c+=i.amount;
  for(const b of S.bills)if(b.status==='paga')c-=b.amount;
  for(const it of D.items)if(S.invoicePaid[it.cardId+'|'+it.dueMi])c-=it.amount;
  return c;
}
/* saldo projetado ao fim do mês: saldo inicial + tudo que entra - tudo que sai (contas e faturas) até o mês */
function projected(mi){
  let c=S.settings.initialBalance||0;
  for(const i of S.incomes)if(miOfDate(i.date)<=mi)c+=i.amount;
  for(const b of S.bills)if(miOfDate(b.due)<=mi)c-=b.amount;
  for(const it of D.items)if(it.dueMi<=mi)c-=it.amount;
  return c;
}
function payables(mi){
  const list=[];
  for(const b of S.bills){
    if(b.status==='paga')continue;
    const od=b.due<D.today;
    if(miOfDate(b.due)===mi||od)list.push({kind:'bill',id:b.id,name:b.name,due:b.due,amount:b.amount,overdue:od});
  }
  for(const k of D.invKeys){
    const inv=invoice(k.cardId,k.dueMi);
    if(inv.paid||inv.total<=0)continue;
    const od=inv.due<D.today;
    if(k.dueMi===mi||od)list.push({kind:'inv',id:k.cardId+'|'+k.dueMi,name:'Fatura '+inv.card.name,due:inv.due,amount:inv.total,overdue:od});
  }
  return list.sort(byDate('due'));
}
function cardUsage(card){
  const used=sumBy(D.items.filter(i=>i.cardId===card.id&&!S.invoicePaid[i.cardId+'|'+i.dueMi]),i=>i.amount);
  return{used,avail:card.limit-used};
}
function defaultInvMi(card){
  for(let mi=D.todayMi-1;mi<=D.todayMi+3;mi++)if(invDates(card,mi).closing>D.today)return mi;
  return D.todayMi;
}

/* ---------- toasts e modais ---------- */
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),2800);
}
let modalEl=null,lastFocus=null;
function closeModal(){
  if(!modalEl)return;
  const c=modalEl._cancel;const el=modalEl;modalEl=null;
  el.remove();document.body.classList.remove('modal-open');
  if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){}
  if(c)c();
}
function openModal(title,inner){
  closeModal();
  lastFocus=document.activeElement;
  const wrap=document.createElement('div');wrap.className='modal-wrap';
  wrap.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal-head"><h2 id="mt">'+esc(title)+'</h2><button class="icon-btn" data-act="close-modal" aria-label="Fechar">'+ic('x')+'</button></div><div class="modal-body">'+inner+'</div></div>';
  wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closeModal();});
  document.body.appendChild(wrap);modalEl=wrap;document.body.classList.add('modal-open');
  const first=$('input[type=text],input:not([type]),input[inputmode],select,textarea',wrap)||$('.btn',wrap);
  if(first&&first.focus)first.focus();
  return wrap;
}
function ask(title,text,choices){
  return new Promise(res=>{
    const wrap=openModal(title,'<p class="muted-p">'+text+'</p><div class="modal-actions">'+choices.map((c,i)=>'<button type="button" class="btn '+(c.cls||'')+'" data-choice="'+i+'">'+esc(c.label)+'</button>').join('')+'</div>');
    wrap._cancel=()=>res(null);
    wrap.addEventListener('click',e=>{const b=e.target.closest('[data-choice]');if(b){wrap._cancel=null;closeModal();res(choices[+b.dataset.choice].v);}});
  });
}
const confirmDel=(title,text)=>ask(title,text,[{v:null,label:'Cancelar'},{v:'ok',label:'Excluir',cls:'danger'}]);
const showErr=(form,msg)=>{const e=$('.err',form);if(e)e.textContent=msg;};

function indicator(a){
  const inc=a.incTotal,sp=a.spentPlan;
  if(!inc&&!sp)return{tone:'muted',title:'Tudo calminho por aqui',text:'Adicione o que entra e o que sai para ver como o mês está.',pct:0};
  if(!inc)return{tone:'neg',title:'Gastos sem nenhuma receita 🚨',text:'Você tem '+money(sp)+' em gastos e nada para receber.',pct:100};
  const pct=sp/inc*100;
  if(sp>inc)return{tone:'neg',title:'Alerta de gastança! 🚨',text:'Você vai gastar '+money(sp-inc)+' a mais do que ganha.',pct:100};
  if(pct>=85)return{tone:'warn',title:'Segura o cartão! 💳',text:'Quase tudo o que você ganha já tem destino. Sobram '+money(inc-sp)+'.',pct};
  return{tone:'pos',title:'Arrasou! 💅',text:'Você está gastando menos do que ganha. Sobram '+money(inc-sp)+'.',pct};
}

function mkChart(id,cfg){

function catEntries(cat){
  const e=Object.entries(cat).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]);
  if(e.length>7){const rest=sumBy(e.slice(6),x=>x[1]);return e.slice(0,6).concat([['Outros (agrupado)',rest]]);}
  return e;
}
function catChart(canvasId,listId,cat){

  if(!document.getElementById(canvasId))return;
  mkChart(canvasId,{type:'doughnut',data:{labels:e.map(x=>x[0]),datasets:[{data:e.map(x=>x[1]/100),backgroundColor:e.map(x=>catColor(x[0])),borderColor:cv('--surface'),borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:'66%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.label+': '+money(Math.round(c.parsed*100))}}}}});

  }).join('')+'<button class="ccard-add" data-act="new-card">'+ic('plus',24)+'Novo cartão</button></div>';
  /* faturas do cartão selecionado */
  const lo=Math.min(D.todayMi-2,U.invMi),hi=Math.max(D.todayMi+11,U.invMi);
  let chips='';
  for(let m=lo;m<=hi;m++){
    const i=invoice(card.id,m),st=i.overdue?'atrasada':i.total>0?i.status:'';
    chips+='<button class="inv-chip '+(m===U.invMi?'on':'')+'" data-act="pick-inv" data-mi="'+m+'"><b><i class="st '+st+'"></i>'+miShort(m)+'</b><span>'+(i.total>0?money(i.total):'—')+'</span></button>';
  }
  const inv=invoice(card.id,U.invMi);
  const stLabel=inv.paid?'Paga':inv.overdue?'Atrasada':inv.status==='fechada'?'Fechada':'Aberta';
  const stCls=inv.paid?'pos':inv.overdue?'neg':inv.status==='fechada'?'warn':'muted';
  html+='<div class="card pad"><div class="card-h"><h2>Faturas · '+esc(card.name)+'</h2></div><div class="inv-scroll" id="invScroll">'+chips+'</div>';
  html+='<div class="inv-head"><div><div class="note">Fatura de '+miLabel(U.invMi).toLowerCase()+'</div><div class="inv-total">'+money(inv.total)+'</div><div class="note" style="margin-top:4px">Fecha em '+fmtDate(inv.closing)+' · vence em '+fmtDate(inv.due)+'</div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip '+stCls+'">'+stLabel+'</span>'
    +(inv.total>0?'<button class="btn '+(inv.paid?'':'primary')+'" data-act="'+(inv.paid?'unpay-inv':'pay-inv')+'" data-id="'+card.id+'|'+U.invMi+'">'+(inv.paid?'Desfazer pagamento':ic('check',18)+'Marcar como paga')+'</button>':'')
    +'</div></div>';
  if(inv.items.length){
    html+='<div class="list" style="border:1px solid var(--line);border-radius:16px;box-shadow:none">'+inv.items.slice().sort(byDate('date')).map(it=>'<div class="row"><div class="date">'+it.date.slice(8)+'<small>'+MS[miOfDate(it.date)%12]+'</small></div><div class="main"><div class="ttl">'+esc(it.desc)+'</div>'+meta([dot(it.category)+esc(it.category),it.n>1?'Parcela '+it.k+' de '+it.n:'À vista'])+'</div><div class="amt">'+money(it.amount)+'</div><div class="actions">'+iconBtn('edit-purchase',it.pid,'edit','Editar compra')+iconBtn('del-purchase',it.pid,'trash','Excluir compra')+'</div></div>').join('')+'</div>';
    html+='<p class="note" style="margin-top:10px">Pagar a fatura tira o valor do seu saldo, mas não vira uma nova despesa: as compras já foram contadas como gastos.</p>';
  }else html+=empty('Fatura vazia','Nenhuma compra cai nesta fatura.','new-purchase','Registrar compra');
  html+='</div>';
  /* compromisso futuro */
  const unpaidInst=D.items.filter(i=>i.n>1&&!S.invoicePaid[i.cardId+'|'+i.dueMi]);
  const instTotal=sumBy(unpaidInst,i=>i.amount);
  if(unpaidInst.length)html+='<p class="note" style="margin-top:12px">Parcelas ainda a pagar: <b>'+money(instTotal)+'</b> em '+unpaidInst.length+(unpaidInst.length===1?' parcela':' parcelas')+'.</p>';
  post.push(()=>{
    const sc=document.getElementById('invScroll'),on=sc&&sc.querySelector('.on');
    if(sc&&on)sc.scrollLeft=Math.max(0,on.offsetLeft-sc.clientWidth/2+on.offsetWidth/2);
  });
  return html;
};

/* ---------- Planejamento ---------- */
PAGES.planejamento=function(){
  const mi=U.mi,a=agg(mi);
  const pct=S.settings.savePct;
  const meta_=Math.round(a.incTotal*pct/100);
  const sobra=a.net,gastar=Math.max(0,sobra-meta_),guardar=Math.max(0,sobra),proj=projected(mi);
  const basis=Math.max(a.incTotal,a.committed,1);
  const w=v=>(Math.max(0,v)/basis*100).toFixed(2);
  let html=head('Planejamento',miLabel(mi));
  html+='<div class="plan-grid">';
  html+='<div class="card pad"><div class="card-h"><h2>Entradas</h2></div><div class="kv"><span>Vou receber</span><b class="t-pos">'+money(a.incTotal)+'</b></div><div class="kv"><span>Já recebi</span><b>'+money(a.incRec)+'</b></div><div class="kv"><span>Falta receber</span><b class="t-warn">'+money(a.incPen)+'</b></div></div>';
  html+='<div class="card pad"><div class="card-h"><h2>Compromissos</h2></div><div class="kv"><span>Contas fixas</span><b>'+money(a.billsFixed)+'</b></div><div class="kv"><span>Despesas variáveis</span><b>'+money(a.billsVar)+'</b></div><div class="kv"><span>Faturas dos cartões</span><b>'+money(a.invTotal)+'</b></div><div class="kv total"><span>Total comprometido</span><b class="t-neg">'+money(a.committed)+'</b></div></div>';
  html+='<div class="card pad"><div class="card-h"><h2>Sobra do mês</h2></div><div class="kv total"><span>Sobra prevista</span><b class="'+(sobra<0?'t-neg':'t-pos')+'">'+money(sobra)+'</b></div><div class="kv"><span>Meta de guardar <input class="inline-in" type="number" id="savePct" min="0" max="100" value="'+pct+'" data-change="save-pct" aria-label="Meta de guardar em porcentagem da renda"> %</span><b>'+money(meta_)+'</b></div><div class="kv"><span>Ainda posso gastar</span><b class="'+(gastar>0?'t-pos':'t-muted')+'">'+money(gastar)+'</b></div><div class="kv"><span>Devo conseguir guardar</span><b>'+money(guardar)+'</b></div></div>';
  html+='</div>';
  const goal=sobra>=meta_?'<span class="chip pos">Meta de guardar atingida</span>':a.incTotal>0?'<span class="chip '+(sobra<0?'neg':'warn')+'">'+(sobra<0?'Despesas acima das receitas':'Faltam '+money(meta_-Math.max(0,sobra))+' para a meta')+'</span>':'';
  html+='<div class="card pad"><div class="card-h"><h2>Para onde vai a sua renda</h2>'+goal+'</div><div class="alloc" role="img" aria-label="Divisão da renda entre contas fixas, variáveis, cartões e sobra"><i style="width:'+w(a.billsFixed)+'%;background:var(--brand)"></i><i style="width:'+w(a.billsVar)+'%;background:var(--warn)"></i><i style="width:'+w(a.invTotal)+'%;background:var(--neg)"></i><i style="width:'+w(sobra)+'%;background:var(--pos)"></i></div><div class="legend"><span><i style="background:var(--brand)"></i>Contas fixas</span><span><i style="background:var(--warn)"></i>Variáveis</span><span><i style="background:var(--neg)"></i>Cartões</span><span><i style="background:var(--pos)"></i>Sobra</span></div>';
  html+='<div class="kv" style="margin-top:14px"><span>Saldo previsto no fim do mês</span><b class="'+(proj<0?'t-neg':'t-pos')+'">'+money(proj)+'</b></div><p class="note" style="margin-top:8px">O saldo previsto é o seu saldo inicial mais tudo o que entra, menos tudo o que sai até o fim do mês (contas e faturas). As compras no cartão contam pela fatura que vence no mês, e o pagamento da fatura não é somado de novo.</p></div>';
  html+='<div class="sec-t"><h2>Próximos meses</h2></div><div class="card pad"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mês</th><th class="r">A receber</th><th class="r">Contas</th><th class="r">Cartões</th><th class="r">Sobra prevista</th></tr></thead><tbody>';
  for(let m=mi;m<mi+6;m++){const x=agg(m);html+='<tr class="click '+(m===mi?'cur':'')+'" data-act="set-mi" data-mi="'+m+'"><td>'+cap(MONTHS[m%12])+'/'+String(Math.floor(m/12)).slice(2)+'</td><td class="r t-pos">'+money(x.incTotal)+'</td><td class="r">'+money(x.billsTotal)+'</td><td class="r">'+money(x.invTotal)+'</td><td class="r '+(x.net<0?'t-neg':'t-pos')+'"><b>'+money(x.net)+'</b></td></tr>';}
  html+='</tbody></table></div></div>';
  return html;
};

/* ---------- Relatórios ---------- */
PAGES.relatorios=function(){
  const mi=U.mi;
  const tabs=[['geral','Visão geral'],['categorias','Categorias'],['pagamentos','Pagamentos'],['faturas','Faturas'],['comparar','Comparar meses']];
  let html=head('Relatórios',miLabel(mi));
  html+='<div class="pills">'+tabs.map(t=>'<button class="pill '+(U.repTab===t[0]?'on':'')+'" data-act="rep-tab" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  const w0=mi-5,w1=mi+6;
  if(U.repTab==='geral'){
    html+='<div class="card pad" style="margin-bottom:14px"><div class="card-h"><h2>Receitas × despesas</h2><div class="legend"><span><i style="background:var(--pos)"></i>Receitas</span><span><i style="background:var(--neg)"></i>Despesas</span></div></div><div class="chart-box"><canvas id="rpIE" role="img" aria-label="Receitas e despesas por mês"></canvas></div><p class="note" style="margin-top:8px">Meses depois de '+miLabel(D.todayMi).toLowerCase()+' são previsões e aparecem mais claros.</p></div>';
    html+='<div class="card pad"><div class="card-h"><h2>Evolução do saldo</h2></div><div class="chart-box"><canvas id="rpBal" role="img" aria-label="Saldo previsto ao fim de cada mês"></canvas></div><p class="note" style="margin-top:8px">Saldo ao fim de cada mês, considerando tudo o que entra e sai (contas e faturas).</p></div>';
    post.push(()=>{
      const lab=[],inc=[],exp=[],bal=[];
      for(let m=w0;m<=w1;m++){const x=agg(m);lab.push(miShort(m));inc.push(x.incTotal/100);exp.push(x.spentPlan/100);bal.push(projected(m)/100);}
      const fade=(c)=>lab.map((_,i)=>(w0+i>D.todayMi)?c+'88':c);
      mkChart('rpIE',{type:'bar',data:{labels:lab,datasets:[{label:'Receitas',data:inc,backgroundColor:fade(cv('--pos')),borderRadius:5,maxBarThickness:22},{label:'Despesas',data:exp,backgroundColor:fade(cv('--neg')),borderRadius:5,maxBarThickness:22}]},options:baseOpts()});
      mkChart('rpBal',{type:'line',data:{labels:lab,datasets:[{label:'Saldo',data:bal,borderColor:cv('--brand'),backgroundColor:cv('--brand'),tension:.3,pointRadius:3,fill:false}]},options:baseOpts()});
    });
  }
  if(U.repTab==='categorias'){
    const year=Math.floor(mi/12);
    const cat={};
    if(U.catScope==='mes')Object.assign(cat,agg(mi).cat);
    else for(let m=year*12;m<year*12+12;m++){const c=agg(m).cat;for(const k in c)cat[k]=(cat[k]||0)+c[k];}
    const e=Object.entries(cat).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]),total=sumBy(e,x=>x[1]);
    html+='<div class="pills"><button class="pill '+(U.catScope==='mes'?'on':'')+'" data-act="cat-scope" data-v="mes">'+miLabel(mi)+'</button><button class="pill '+(U.catScope==='ano'?'on':'')+'" data-act="cat-scope" data-v="ano">Ano de '+year+'</button></div>';
    if(!e.length)html+='<div class="card">'+empty('Sem gastos no período','Cadastre contas ou compras no cartão para ver os gastos por categoria.')+'</div>';
    else{
      html+='<div class="grid2"><div class="card pad"><div class="card-h"><h2>Distribuição</h2><b>'+money(total)+'</b></div><div class="donut-wrap"><div class="chart-box"><canvas id="rpCat" role="img" aria-label="Gastos por categoria"></canvas></div><div class="cat-list" id="rpCatList"></div></div></div>';
      html+='<div class="card pad"><div class="card-h"><h2>Ranking</h2></div>'+e.map(x=>'<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-weight:600">'+'<span>'+dot(x[0])+esc(x[0])+'</span><span>'+money(x[1])+'</span></div><div class="bar" style="margin-top:6px"><i style="width:'+(x[1]/e[0][1]*100)+'%;background:'+catColor(x[0])+'"></i></div></div>').join('')+'</div></div>';
      post.push(()=>catChart('rpCat','rpCatList',cat));
    }
  }
  if(U.repTab==='pagamentos'){
    const year=Math.floor(mi/12),rows=[];
    for(const b of S.bills)if(b.status==='paga'){const d=b.paidDate||b.due;if(+d.slice(0,4)===year)rows.push({date:d,name:b.name,sub:b.method||'',amount:b.amount,kind:'Conta'});}
    for(const k in S.invoicePaid){const p=k.split('|'),c=cardById(p[0]);if(!c)continue;const d=S.invoicePaid[k].date;if(+d.slice(0,4)!==year)continue;const inv=invoice(c.id,+p[1]);if(inv.total>0)rows.push({date:d,name:'Fatura '+c.name+' ('+miShort(+p[1])+')',sub:'Cartão de crédito',amount:inv.total,kind:'Fatura'});}
    rows.sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:0);
    html+='<div class="sumrow">'+sum('Total pago em '+year,sumBy(rows,r=>r.amount),'')+'<div class="card sum"><small>Pagamentos</small><b>'+rows.length+'</b></div></div>';
    html+='<div class="card list">'+(rows.length?rows.map(r=>'<div class="row"><div class="date">'+r.date.slice(8)+'<small>'+MS[+r.date.slice(5,7)-1]+'</small></div><div class="main"><div class="ttl">'+esc(r.name)+'</div>'+meta([esc(r.sub),r.kind==='Fatura'?'<span class="chip muted">Fatura</span>':''])+'</div><div class="amt">'+money(r.amount)+'</div></div>').join(''):empty('Nenhum pagamento em '+year,'Quando você marcar contas ou faturas como pagas, elas aparecem aqui.'))+'</div>';
  }
  if(U.repTab==='faturas'){
    const rows=[];
    for(const k of D.invKeys){if(k.dueMi<w0-6||k.dueMi>w1)continue;const inv=invoice(k.cardId,k.dueMi);if(inv.total>0)rows.push(inv);}
    rows.sort((x,y)=>y.dueMi-x.dueMi||x.card.name.localeCompare(y.card.name));
    html+='<div class="card pad" style="margin-bottom:14px"><div class="card-h"><h2>Faturas por mês</h2><div class="legend">'+S.cards.map(c=>'<span><i style="background:'+c.color+'"></i>'+esc(c.name)+'</span>').join('')+'</div></div><div class="chart-box"><canvas id="rpInv" role="img" aria-label="Valor das faturas por mês e por cartão"></canvas></div></div>';
    html+='<div class="card pad"><div class="card-h"><h2>Histórico das faturas</h2></div>'+(rows.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fatura</th><th>Cartão</th><th>Vencimento</th><th class="r">Valor</th><th>Situação</th></tr></thead><tbody>'+rows.map(i=>'<tr class="click" data-act="open-inv" data-id="'+i.card.id+'|'+i.dueMi+'"><td>'+miLabel(i.dueMi)+'</td><td>'+esc(i.card.name)+'</td><td>'+fmtDate(i.due)+'</td><td class="r"><b>'+money(i.total)+'</b></td><td><span class="chip '+(i.paid?'pos':i.overdue?'neg':i.status==='fechada'?'warn':'muted')+'">'+(i.paid?'Paga':i.overdue?'Atrasada':i.status==='fechada'?'Fechada':'Aberta')+'</span></td></tr>').join('')+'</tbody></table></div>':empty('Nenhuma fatura','Registre compras no cartão para ver o histórico.'))+'</div>';
    post.push(()=>{
      const lab=[];for(let m=w0;m<=w1;m++)lab.push(miShort(m));
      const ds=S.cards.map(c=>{const d=[];for(let m=w0;m<=w1;m++)d.push(sumBy(D.items.filter(i=>i.cardId===c.id&&i.dueMi===m),i=>i.amount)/100);return{label:c.name,data:d,backgroundColor:c.color,borderRadius:4,maxBarThickness:28};});
      mkChart('rpInv',{type:'bar',data:{labels:lab,datasets:ds},options:baseOpts({scales:{x:{stacked:true,grid:{display:false},ticks:{color:cv('--muted')}},y:{stacked:true,grid:{color:cv('--line')},border:{display:false},ticks:{color:cv('--muted'),callback:v=>'R$ '+compact(v)}}}})});
    });
  }
  if(U.repTab==='comparar'){
    if(U.cmpA==null)U.cmpA=mi;
    if(U.cmpB==null)U.cmpB=mi-1;
    const A=agg(U.cmpA),B=agg(U.cmpB);
    const opts=[];for(let m=D.todayMi-30;m<=D.todayMi+18;m++)opts.push([m,miLabel(m)]);
    if(!opts.some(o=>o[0]===U.cmpA))opts.push([U.cmpA,miLabel(U.cmpA)]);
    if(!opts.some(o=>o[0]===U.cmpB))opts.push([U.cmpB,miLabel(U.cmpB)]);
    opts.sort((x,y)=>x[0]-y[0]);
    const row=(l,x,y,good)=>{const d=x-y,p=y?Math.round(d/Math.abs(y)*100):null;const better=good?d>0:d<0;return '<tr><td>'+l+'</td><td class="r">'+money(x)+'</td><td class="r">'+money(y)+'</td><td class="r '+(d===0?'t-muted':better?'t-pos':'t-neg')+'">'+(d>0?'+':'')+money(d)+(p!==null?' ('+(d>0?'+':'')+p+'%)':'')+'</td></tr>';};
    const rA=A.incTotal-A.spentPlan,rB=B.incTotal-B.spentPlan;
    html+='<div class="card pad"><div class="inline-form" style="margin-bottom:16px"><label class="field"><span>Mês A</span><select data-change="cmp-a">'+optList(opts,U.cmpA)+'</select></label><label class="field"><span>Mês B</span><select data-change="cmp-b">'+optList(opts,U.cmpB)+'</select></label></div>';
    html+='<div class="chart-box" style="height:230px"><canvas id="rpCmp" role="img" aria-label="Comparativo entre os dois meses"></canvas></div>';
    html+='<div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Indicador</th><th class="r">'+miShort(U.cmpA)+'</th><th class="r">'+miShort(U.cmpB)+'</th><th class="r">Diferença (A − B)</th></tr></thead><tbody>'
      +row('Receitas',A.incTotal,B.incTotal,true)+row('Despesas',A.spentPlan,B.spentPlan,false)+row('Contas fixas',A.billsFixed,B.billsFixed,false)+row('Contas variáveis',A.billsVar,B.billsVar,false)+row('Compras no cartão',A.cardSpend,B.cardSpend,false)+row('Resultado (receitas − despesas)',rA,rB,true);
    const cats=[...new Set(Object.keys(A.cat).concat(Object.keys(B.cat)))].sort();
    cats.forEach(c=>{html+=row(dot(c)+esc(c),A.cat[c]||0,B.cat[c]||0,false);});
    html+='</tbody></table></div></div>';
    post.push(()=>{
      mkChart('rpCmp',{type:'bar',data:{labels:['Receitas','Despesas','Resultado'],datasets:[{label:miShort(U.cmpA),data:[A.incTotal/100,A.spentPlan/100,rA/100],backgroundColor:cv('--brand'),borderRadius:6,maxBarThickness:40},{label:miShort(U.cmpB),data:[B.incTotal/100,B.spentPlan/100,rB/100],backgroundColor:cv('--muted')+'99',borderRadius:6,maxBarThickness:40}]},options:baseOpts({plugins:{legend:{display:true,labels:{color:cv('--muted'),usePointStyle:true,boxWidth:8}},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+money(Math.round(c.parsed.y*100))}}}})});
    });
  }
  return html;
};

/* ---------- Ajustes ---------- */
PAGES.ajustes=function(){
  let html=head('Ajustes','Conta, saldo inicial e backup');
  html+='<div class="card set-sec"><h2>Minha conta</h2><p class="note">Você entrou como <b>'+esc(UEMAIL)+'</b>.<br><span class="syncStat"></span></p><form data-form="chpw" class="inline-form" novalidate><label class="field"><span>Nova senha</span><input type="password" name="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></label><button class="btn" type="submit">Trocar senha</button></form><p class="err" role="alert" style="margin:8px 0 0"></p><div style="margin-top:8px"><button class="btn" data-act="logout">Sair da conta</button></div></div>';
  html+='<div class="card set-sec"><h2>Saldo inicial</h2><p class="note">Quanto você tinha em conta antes do primeiro lançamento. É a base do saldo disponível e do saldo previsto.</p><div class="inline-form"><label class="field"><span>Saldo inicial (R$)</span><input id="initBal" inputmode="decimal" value="'+centsToInput(S.settings.initialBalance||0)+'"></label><button class="btn primary" data-act="save-initial">Salvar saldo inicial</button></div></div>';

};

const FORMS={};
FORMS.income=function(form){
  const fd=new FormData(form),id=form.dataset.id;
  const desc=(fd.get('desc')||'').trim(),amount=parseMoney(fd.get('amount')),date=fd.get('date');
  const err=!desc?'Informe a descrição.':!(amount>0)?'Informe um valor maior que zero.':!date?'Informe a data de recebimento.':'';
  if(err)return showErr(form,err);
  const base={desc,amount,date,category:fd.get('category'),status:fd.get('status')};
  if(id){
    const it=S.incomes.find(x=>x.id===id),orig=it.date;
    Object.assign(it,base);delete it.demo;
    if(fd.get('scope')==='next'&&it.gid)S.incomes.filter(x=>x.gid===it.gid&&x.id!==it.id&&x.date>orig).forEach(x=>Object.assign(x,{desc,amount,category:base.category}));
  }else{
    const n=fd.get('repeat')?clamp(parseInt(fd.get('count'),10)||1,1,60):1,gid=n>1?uid():null;
    for(let k=0;k<n;k++)S.incomes.push(Object.assign({id:uid(),gid,notes:''},base,{date:addMonths(date,k),status:k===0?base.status:'pendente'}));
  }
  closeModal();commit();toast('Receita salva');
};
FORMS.bill=function(form){
  const fd=new FormData(form),id=form.dataset.id;
  const name=(fd.get('name')||'').trim(),amount=parseMoney(fd.get('amount')),due=fd.get('due');
  const err=!name?'Informe o nome da conta.':!(amount>0)?'Informe um valor maior que zero.':!due?'Informe a data de vencimento.':'';
  if(err)return showErr(form,err);
  const base={name,amount,due,category:fd.get('category'),status:fd.get('status')};
  const paidDate=d=>d<=D.today?d:D.today;
  if(id){
    const b=S.bills.find(x=>x.id===id),orig=b.due,was=b.status;
    Object.assign(b,base);delete b.demo;
    if(b.status==='paga'){if(was!=='paga'||!b.paidDate)b.paidDate=paidDate(due);}else delete b.paidDate;
    if(fd.get('scope')==='next'&&b.gid)S.bills.filter(x=>x.gid===b.gid&&x.id!==b.id&&x.due>orig).forEach(x=>Object.assign(x,{name,amount,category:base.category}));
  }else{
    const freq=fd.get('freq')||'unica';
    const n=freq!=='unica'&&fd.get('repeat')?clamp(parseInt(fd.get('count'),10)||1,1,60):1,gid=n>1?uid():null;
    for(let k=0;k<n;k++){
      const d=freq==='semanal'?addDays(due,7*k):freq==='anual'?addMonths(due,12*k,parseYMD(due).d):addMonths(due,k);
      const st=k===0?base.status:'pendente';
      const o=Object.assign({id:uid(),gid,freq,tipo:(freq==='mensal'||freq==='anual')?'fixa':'variavel',method:'Pix'},base,{due:d,status:st});
      if(st==='paga')o.paidDate=paidDate(d);
      S.bills.push(o);
    }
  }
  closeModal();commit();toast('Conta salva');
};
FORMS.card=function(form){
  const fd=new FormData(form),id=form.dataset.id;
  const name=(fd.get('name')||'').trim(),limit=parseMoney(fd.get('limit'));
  const cd=parseInt(fd.get('closingDay'),10),dd=parseInt(fd.get('dueDay'),10);
  const err=!name?'Informe o nome do cartão.':!(limit>0)?'Informe o limite total.':!(cd>=1&&cd<=31)?'O dia de fechamento deve estar entre 1 e 31.':!(dd>=1&&dd<=31)?'O dia de vencimento deve estar entre 1 e 31.':'';
  if(err)return showErr(form,err);
  const o={name,limit,closingDay:cd,dueDay:dd,color:fd.get('color')||CARD_COLORS[0]};
  if(id){const c=cardById(id);Object.assign(c,o);delete c.demo;U.invMi=null;}
  else{const c=Object.assign({id:uid()},o);S.cards.push(c);U.cardId=c.id;U.invMi=null;}
  closeModal();commit();toast('Cartão salvo');
};
FORMS.purchase=function(form){
  const fd=new FormData(form),id=form.dataset.id;
  const desc=(fd.get('desc')||'').trim(),total=parseMoney(fd.get('total')),date=fd.get('date'),n=parseInt(fd.get('n'),10)||1;
  const err=!desc?'Informe a descrição da compra.':!(total>0)?'Informe um valor maior que zero.':!date?'Informe a data da compra.':total<n?'O valor é pequeno demais para este número de parcelas.':'';
  if(err)return showErr(form,err);
  const o={cardId:fd.get('cardId'),desc,total,n,category:fd.get('category'),date};
  if(id){const p=S.purchases.find(x=>x.id===id);Object.assign(p,o);delete p.demo;}
  else S.purchases.push(Object.assign({id:uid()},o));
  U.cardId=o.cardId;
  U.invMi=firstDueMi(cardById(o.cardId),date);
  closeModal();commit();toast(n>1?'Compra parcelada salva':'Compra salva');
};

async function delRecurring(coll,id,noun){
  const key=coll==='bills'?'due':'date';
  const it=S[coll].find(x=>x.id===id);if(!it)return;
  const later=it.gid?S[coll].filter(x=>x.gid===it.gid&&x.id!==id&&x[key]>it[key]):[];
  let r;
  if(later.length)r=await ask('Excluir '+noun,'Este lançamento se repete e há mais '+later.length+(later.length===1?' lançamento posterior.':' lançamentos posteriores.'),[{v:null,label:'Cancelar'},{v:'one',label:'Só este',cls:'danger'},{v:'next',label:'Este e os próximos',cls:'danger'}]);
  else r=await confirmDel('Excluir '+noun,'Tem certeza que quer excluir “'+esc(it.name||it.desc)+'”? Não dá para desfazer.');
  if(!r)return;
  const rm=new Set([id]);
  if(r==='next')later.forEach(x=>rm.add(x.id));
  S[coll]=S[coll].filter(x=>!rm.has(x.id));
  commit();toast(rm.size>1?rm.size+' lançamentos excluídos':'Excluído');
}

CHG['save-pct']=el=>{S.settings.savePct=clamp(parseInt(el.value,10)||0,0,100);commit();};

CHG['cmp-b']=el=>{U.cmpB=+el.value;render();};

/* ================= navegação e renderização ================= */
const NAV=[['painel','Painel','home'],['receitas','Receitas','trend'],['contas','Contas','receipt'],['cartoes','Cartões','card'],['ajustes','Ajustes','sliders']];
function setMi(mi){U.mi=mi;U.invMi=mi;render();}
function go(page){if(location.hash==='#'+page)route();else location.hash=page;}
function route(){
  if(!UID||!S)return;
  const h=location.hash.replace('#','');
  U.page=PAGES[h]?h:'painel';
  ACT['close-menu']();
  render();
  window.scrollTo(0,0);
}
function buildShell(){
  $('#brandIc').innerHTML=ic('heart',20);
  $('#menuBtn').innerHTML=ic('menu');$('#prevBtn').innerHTML=ic('chevL',18);$('#nextBtn').innerHTML=ic('chevR',18);
  $('#newBtn').innerHTML=ic('plus',18)+'<span class="lbl">Novo</span>';
  $('#newBtn').setAttribute('aria-label','Novo lançamento');
  $('#newmenu').innerHTML='<button role="menuitem" data-act="new-income">'+ic('up',18)+'Nova receita</button><button role="menuitem" data-act="new-bill">'+ic('receipt',18)+'Nova conta</button><button role="menuitem" data-act="new-purchase">'+ic('card',18)+'Compra no cartão</button>';
  $('#selM').innerHTML=MONTHS.map((m,i)=>'<option value="'+i+'">'+cap(m)+'</option>').join('');
  $('#nav').innerHTML=NAV.map(n=>'<a href="#'+n[0]+'" data-nav="'+n[0]+'">'+ic(n[2])+n[1]+'</a>').join('');
}
function updateTopbar(){
  const y=Math.floor(U.mi/12),ty=Math.floor(D.todayMi/12);
  const lo=Math.min(ty-5,y),hi=Math.max(ty+6,y);
  let o='';for(let i=lo;i<=hi;i++)o+='<option value="'+i+'">'+i+'</option>';
  $('#selY').innerHTML=o;$('#selY').value=y;$('#selM').value=U.mi%12;
  $('#todayBtn').style.visibility=U.mi===D.todayMi?'hidden':'visible';
  $$('#nav a').forEach(a=>{const on=a.dataset.nav===U.page;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
}
function destroyCharts(){charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];}
function render(){
  if(!S)return;
  derive();destroyCharts();post=[];updateTopbar();
  const banners=(S.demo?'<div class="banner"><div>'+ic('alert',18)+'<span>Você está vendo <b>dados de demonstração</b>. Explore à vontade e remova-os quando quiser começar com os seus.</span></div><button class="btn" data-act="demo-remove">Remover dados de demonstração</button></div>':'')
    +(!storageOK?'<div class="banner neg"><div>'+ic('alert',18)+'<span>Este navegador não está permitindo salvar os dados. Eles vão sumir ao fechar a página.</span></div></div>':'');
  $('#view').innerHTML=banners+PAGES[U.page]();
  const fns=post;post=[];fns.forEach(f=>{try{f();}catch(e){console.error(e);}});
  cloudSet(cloud.state);
}

/* ================= eventos globais ================= */
document.addEventListener('click',e=>{
  const nm=$('#newmenu');
  if(!nm.hidden&&!e.target.closest('.newwrap')){nm.hidden=true;$('#newBtn').setAttribute('aria-expanded','false');}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  /* clique em botões internos de um cartão não deve selecionar o cartão duas vezes */
  const fn=ACT[el.dataset.act];
  if(fn){
    if(el.closest('#newmenu')){nm.hidden=true;$('#newBtn').setAttribute('aria-expanded','false');}
    if(e.target.closest('.cc-act')&&el.dataset.act==='select-card')return;
    fn(el,e);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();ACT['close-menu']();const nm=$('#newmenu');nm.hidden=true;}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('ccard')){e.preventDefault();ACT['select-card'](e.target);}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-change]');if(el&&CHG[el.dataset.change])CHG[el.dataset.change](el,e);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();FORMS[f.dataset.form](f);
});
window.addEventListener('hashchange',route);
try{
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  (mq.addEventListener?mq.addEventListener.bind(mq,'change'):mq.addListener.bind(mq))(()=>render());
}catch(e){}
try{new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}

/* ================= login ================= */
let appStarted=false,shellBuilt=false,pendingSetPw=false;
const hashP=new URLSearchParams(location.hash.replace(/^#/,''));
const linkType=hashP.get('type'),linkErr=hashP.get('error_description');
if(linkType==='invite'||linkType==='recovery')pendingSetPw=true;

function showAuth(mode,msg,tone){
  $('.app').classList.add('hide');
  const a=$('#auth');a.classList.remove('hide');
  const m=msg?'<p class="'+(tone==='ok'?'auth-ok':'err')+'" role="alert">'+esc(msg)+'</p>':'<p class="err" role="alert"></p>';
  const logo='<span class="script">Bibia 💖</span>';
  let body='';
  if(mode==='login')body=logo+'<p class="sub">Entre para ver o seu dinheirinho</p><form data-form="login" novalidate>'+field('E-mail','<input type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off">')+field('Senha','<input type="password" name="password" autocomplete="current-password">')+m+'<button class="btn primary block" type="submit">Entrar</button><button type="button" class="btn block" data-act="auth-first">Primeiro acesso</button><button type="button" class="btn ghost block" data-act="auth-forgot">Esqueci minha senha</button></form>';
  else if(mode==='forgot'||mode==='first')body=logo+'<p class="sub">'+(mode==='first'?'Primeiro acesso? Digite o seu e-mail e enviaremos um link para você criar a sua senha.':'Vamos mandar um link para criar uma nova senha.')+'</p><form data-form="forgot" novalidate>'+field('E-mail','<input type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off">')+m+'<button class="btn primary block" type="submit">'+(mode==='first'?'Enviar link para criar minha senha':'Enviar link por e-mail')+'</button><button type="button" class="btn ghost block" data-act="auth-login">Voltar</button></form>';
  else if(mode==='setpw')body=logo+'<h1>Crie a sua senha</h1><p class="sub">Escolha uma senha com pelo menos 8 caracteres</p><form data-form="setpw" novalidate>'+field('Nova senha','<input type="password" name="password" autocomplete="new-password">')+field('Repita a senha','<input type="password" name="password2" autocomplete="new-password">')+m+'<button class="btn primary block" type="submit">Salvar e entrar</button></form>';
  else body=logo+'<p class="sub">'+esc(msg||'Carregando…')+'</p>';
  a.innerHTML='<div class="auth-card">'+body+'</div>';
  const f=$('input',a);if(f&&mode!=='msg')try{f.focus();}catch(e){}
}
function authError(e){
  const m=String((e&&e.message)||e||'').toLowerCase();
  if(m.includes('invalid login'))return 'E-mail ou senha incorretos.';
  if(m.includes('not confirmed'))return 'Este e-mail ainda não foi confirmado.';
  if(m.includes('fetch')||m.includes('network'))return 'Sem conexão com a internet. Tente de novo.';
  if(m.includes('rate limit')||m.includes('too many')||m.includes('seconds'))return 'Muitas tentativas. Espere um pouquinho e tente de novo.';
  if(m.includes('different from the old'))return 'Escolha uma senha diferente da anterior.';
  if(m.includes('at least'))return 'A senha precisa ter pelo menos 8 caracteres.';
  if(m.includes('session')||m.includes('jwt'))return 'O link expirou. Peça um novo em “Esqueci minha senha”.';
  return 'Algo deu errado. Tente de novo.';
}
function leaveApp(){
  appStarted=false;UID=null;UEMAIL='';S=null;closeModal();destroyCharts();
  $('#view').innerHTML='';
}
async function startApp(user){
  if(appStarted&&UID===user.id)return;
  appStarted=true;UID=user.id;UEMAIL=user.email||'';
  KEY='bibia.v1.'+UID;BAK=KEY+'.bak';
  testStorage();
  S=loadLocal()||fresh();
  $('#auth').classList.add('hide');$('.app').classList.remove('hide');
  if(!shellBuilt){buildShell();shellBuilt=true;}
  U.mi=miOfDate(todayStr());U.cardId=null;U.invMi=null;
  cloudSet('checking');
  route();
  await cloudPull();
}
function onSession(event,session){
  if(event==='PASSWORD_RECOVERY')pendingSetPw=true;
  if(event==='SIGNED_OUT'){if(appStarted){leaveApp();showAuth('login');}return;}
  if(!session){if(event==='INITIAL_SESSION')showAuth('login',linkErr?'O link expirou ou já foi usado. Use “Esqueci minha senha” para receber outro.':null);return;}
  if(pendingSetPw){showAuth('setpw');return;}
  if(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='USER_UPDATED')startApp(session.user);
}

const AUTH_FORMS={};
FORMS.login=async function(form){
  const fd=new FormData(form),email=(fd.get('email')||'').trim(),pw=fd.get('password')||'';
  if(!email||!pw)return showErr(form,'Preencha o e-mail e a senha.');
  const btn=$('button[type=submit]',form);btn.disabled=true;showErr(form,'');
  const r=await sb.auth.signInWithPassword({email,password:pw});
  btn.disabled=false;
  if(r.error)return showErr(form,authError(r.error));
  if(r.data&&r.data.session&&!pendingSetPw)startApp(r.data.session.user);
};
FORMS.forgot=async function(form){
  const email=((new FormData(form)).get('email')||'').trim();
  if(!email)return showErr(form,'Digite o seu e-mail.');
  const btn=$('button[type=submit]',form);btn.disabled=true;
  const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  btn.disabled=false;
  if(r.error)return showErr(form,authError(r.error));
  showAuth('login','Pronto! Se o e-mail estiver liberado, o link chega em instantes. Olhe também o spam.','ok');
};
FORMS.setpw=async function(form){
  const fd=new FormData(form),p1=fd.get('password')||'',p2=fd.get('password2')||'';
  if(p1.length<8)return showErr(form,'A senha precisa ter pelo menos 8 caracteres.');
  if(p1!==p2)return showErr(form,'As duas senhas não são iguais.');
  const btn=$('button[type=submit]',form);btn.disabled=true;
  const r=await sb.auth.updateUser({password:p1});
  btn.disabled=false;
  if(r.error)return showErr(form,authError(r.error));
  pendingSetPw=false;
  try{history.replaceState(null,'',location.pathname+location.search+'#painel');}catch(e){}
  const u=r.data&&r.data.user;
  if(u)startApp(u);else{const g=await sb.auth.getSession();if(g.data&&g.data.session)startApp(g.data.session.user);}
  toast('Senha criada! 💖');
};
FORMS.chpw=async function(form){
  const p=(new FormData(form)).get('password')||'';
  if(p.length<8)return showErr(form,'A senha precisa ter pelo menos 8 caracteres.');
  const r=await sb.auth.updateUser({password:p});
  if(r.error)return showErr(form,authError(r.error));
  form.reset();showErr(form,'');toast('Senha alterada');
};
/* os formulários de login ficam fora do #view: o mesmo ouvinte de submit atende todos */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&UID&&!modalEl)cloudPull();});
window.addEventListener('online',()=>{if(UID){if(cloud.dirty)cloudPush();cloudPull();}});

if(window.supabase&&window.supabase.createClient){
  try{
    sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    sb.auth.onAuthStateChange((event,session)=>{setTimeout(()=>onSession(event,session),0);});
  }catch(e){showAuth('msg','Não foi possível iniciar o login. Tente recarregar a página.');}
}else showAuth('msg','Não foi possível carregar o login. Verifique a internet e recarregue a página.');
